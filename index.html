<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한음식 · Korean Traditional Food</title>
<style>
:root{--fs:18px;--ink:#2b1d14;--paper:#f3e9d2;--red:#9b2d20;--blue:#1f3a5f;--gold:#c8a24a}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif KR","Batang","Malgun Gothic",serif;font-size:var(--fs);color:var(--ink);background:#1b1410;height:100vh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;opacity:0;transition:opacity .6s}
.screen.on{display:block;opacity:1}
/* intro */
#intro{background:#000;display:none;align-items:center;justify-content:center;cursor:pointer}
#intro.on{display:flex}
#intro span{color:#fff;white-space:nowrap;font-weight:300;opacity:0;animation:fill 5.5s ease-in-out forwards}
@keyframes fill{0%{opacity:0;font-size:2vw;letter-spacing:.1em}60%{opacity:1}100%{opacity:1;font-size:8.2vw;letter-spacing:.02em}}
/* start */
#start{background:linear-gradient(#e9c9a0 0%,#f2dcc0 45%,#d6c3a0 100%);overflow:hidden}
#scene{position:absolute;left:50%;bottom:0;width:min(100vw,166vh);aspect-ratio:5/3;transform:translateX(-50%);transform-origin:50% 80%;transition:transform 2.4s ease-in,opacity 2.4s}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#scene.zoom{transform:translateX(-50%) scale(6);opacity:0}
#title{position:absolute;top:5%;width:100%;text-align:center;color:#3a2418;z-index:2;transition:opacity .8s}
#title h1{margin:0;font-size:3.2em;letter-spacing:.3em;font-weight:700}
#title p{margin:.3em 0;font-size:1em;letter-spacing:.15em}
.hbtn{position:absolute;left:50%;top:79%;transform:translate(-50%,-50%);z-index:3;font:inherit;font-size:1.1em;padding:.5em 1.6em;color:#f7ecd0;background:linear-gradient(#a8382a,#7a2a1e);border:3px double var(--gold);border-radius:6px;cursor:pointer;letter-spacing:.3em;box-shadow:0 4px 12px #0007;transition:transform .15s,filter .15s}
.hbtn:hover{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.12)}
/* map */
#map,#food{background:radial-gradient(circle at 50% 40%,#f6edd6,#dccaa0);}
#map::before,#food::before{content:"";position:absolute;inset:10px;border:3px double #8a6a3a;pointer-events:none;border-radius:4px}
.top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;z-index:5}
.top h2{margin:0;font-size:clamp(.8em,2.2vw,1.25em);line-height:1.25;flex:1;text-align:center}
.back{font:inherit;padding:.4em 1em;background:var(--blue);color:#f7ecd0;border:2px solid var(--gold);border-radius:4px;cursor:pointer;letter-spacing:.15em}
.back:hover{filter:brightness(1.2)}
.flags{display:flex;gap:8px}
.flag{width:46px;height:32px;padding:0;border:2px solid transparent;border-radius:3px;cursor:pointer;background:#fff;overflow:hidden;opacity:.65;transition:.15s}
.flag svg{display:block;width:100%;height:100%}
.flag:hover{opacity:1;transform:translateY(-2px)}.flag.sel{opacity:1;border-color:var(--red)}
#gear{font-size:1.4em;background:none;border:0;cursor:pointer}
#mapwrap{position:absolute;top:64px;bottom:12px;left:0;right:0;display:flex;justify-content:center}
#mapsvg{height:100%;max-width:100%}
.reg{fill:#d8c9a3;stroke:#7a6244;stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:fill .25s}
.reg:hover{fill:#b9a07a}
.lbl{opacity:0;transition:opacity .2s;pointer-events:none;text-anchor:middle;font-size:15px;font-weight:700;fill:#2b1d14;paint-order:stroke;stroke:#fff8;stroke-width:3px}
g:hover>.lbl,g.hot>.lbl{opacity:1}
g.hot>.reg{fill:#b9a07a}
/* food */
#foodlist{position:absolute;top:80px;bottom:30px;left:6%;right:6%;display:flex;flex-direction:column;gap:20px;justify-content:center}
.card{flex:1;display:flex;gap:26px;align-items:center;padding:6px 10px;min-height:0;border-bottom:1px solid #8a6a3a55}
.card:last-child{border-bottom:0}
.stamp{flex:0 0 clamp(64px,12vh,96px);height:clamp(64px,12vh,96px);background:#a4372a;color:#f6ead0;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,7vh,56px);font-weight:700;border-radius:4px;transform:rotate(-3deg);box-shadow:inset 0 0 0 3px #a4372a,inset 0 0 0 5px #f6ead099}
.card h3{margin:0 0 .3em;font-size:1.3em;color:#2b1d14;font-weight:700}
.card h3 small{font-weight:400;font-size:.65em;color:#6b5a48;margin-left:.5em}
.card ul{margin:0;padding:0;list-style:none;line-height:1.6;font-size:.88em;color:#3a2e24}#settings{position:absolute;top:64px;right:24px;z-index:9;background:#fffaf0;border:2px solid #8a6a3a;border-radius:6px;padding:12px 16px;display:none;font-size:.85em}
#settings label{display:block;margin:6px 0}
#settings.on{display:block}
</style>
</head>

<section id="intro" class="screen on"><span>made by woo doyeon</span></section>

<section id="map" class="screen">
  <div class="top">

    <div class="flags"></div>
    <button id="gear" title="Settings">⚙</button>
  </div>
  <div id="mapwrap">
    <svg id="mapsvg" viewBox="0 0 400 570"></svg>

</section>

    <button class="back" id="backBtn">← <span data-i="back"></span></button>

</section>

let lang=0,cur=null;
const $=s=>document.querySelector(s);
const AC=new (window.AudioContext||window.webkitAudioContext)();
const master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
const musicG=AC.createGain();musicG.gain.value=.5;musicG.connect(master);

// 한국풍 효과음 (가야금 느낌의 뜯는 소리)
function pluck(t,f,d=.8,v=.3,dest=master){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
const P=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784]; // 오음계
function sfx(kind){
  AC.resume();const t=AC.currentTime;
  const seq={start:[0,2,4,5,7],click:[4,6,7,8],back:[8,6,4,2,0]}[kind];
  seq.forEach((n,i)=>pluck(t+i*(kind==='start'?.16:.08),P[n],kind==='start'?1.2:.5,.35));
}
// 배경음악 3곡 반복
const TRACKS=[
 {bpm:70,n:[4,5,4,2,0,2,4,-1,2,4,5,4,2,0,-1,-1]},
 {bpm:84,n:[0,2,4,2,5,4,2,0,2,4,7,5,4,2,0,-1]},
 {bpm:60,n:[7,5,4,2,4,5,7,-1,5,4,2,0,2,4,-1,-1]}
];
let trk=0,musicOn=false;
function playTrack(){
  if(!musicOn)return;
  const T=TRACKS[trk],step=60/T.bpm,t0=AC.currentTime+.1;
  T.n.forEach((n,i)=>{if(n>=0){pluck(t0+i*step,P[n],1.4,.25,musicG);if(i%4===0)pluck(t0+i*step,P[n]/2,2,.15,musicG)}});
  const len=T.n.length*step;
  trk=(trk+1)%TRACKS.length;
  setTimeout(playTrack,len*1000);
}
function startMusic(){if(!musicOn){musicOn=true;playTrack()}}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on')}
function speak(){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(LANGS[lang].hi);u.lang=LANGS[lang].bcp;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(LANGS[lang].bcp.slice(0,2)));
  if(v)u.voice=v;speechSynthesis.speak(u);
}
function setLang(i,say){
  lang=i;
  document.querySelectorAll('.flag').forEach(f=>f.classList.toggle('sel',+f.dataset.i===i));
  document.querySelectorAll('[data-i]').forEach(e=>{if(UI[e.dataset.i])e.textContent=UI[e.dataset.i][LANGS[i].c]});
  document.documentElement.lang=LANGS[i].c;
  drawMap();if(cur)drawFood();
  if(say)speak();
}
document.querySelectorAll('.flags').forEach(w=>LANGS.forEach((l,i)=>{
  const b=document.createElement('button');b.className='flag';b.dataset.i=i;b.title=l.hi;b.innerHTML=l.svg;
  b.onclick=()=>{sfx('click');setLang(i,true)};w.appendChild(b);
}));

function drawMap(){
  const NS='http://www.w3.org/2000/svg';const s=$('#mapsvg');s.innerHTML='';
  R.forEach(r=>{
    const g=document.createElementNS(NS,'g');
    const sh=document.createElementNS(NS,r.e?'ellipse':'polygon');
    if(r.e){[ 'cx','cy','rx','ry'].forEach((k,i)=>sh.setAttribute(k,r.e[i]))}else sh.setAttribute('points',r.p);
    sh.setAttribute('class','reg');sh.onclick=()=>{sfx('click');cur=r;drawFood();show('food')};
    g.appendChild(sh);
    const t=document.createElementNS(NS,'text');t.setAttribute('class','lbl');
    t.setAttribute('x',r.l[0]);t.setAttribute('y',r.l[1]);
    t.innerHTML=r.id==='seoul'?`<tspan font-size="11">${r.n[0]}</tspan>`:`${r.n[0]}<tspan x="${r.l[0]}" dy="13" font-size="10" font-weight="400">${r.n[1]}</tspan>`;
    g.appendChild(t);s.appendChild(g);
  });
}
function drawFood(){
  $('#regionTitle').textContent=cur.t[lang]+' · '+(lang?cur.t[0]:cur.t[1]);
  $('#foodlist').innerHTML=F[cur.id].map(f=>`<div class="card"><div class="stamp">${f[1][0][0]}</div><div><h3>${f[1][lang]}${lang?' · '+f[1][0]:' · '+f[1][1]}</h3><ul>${f[2+lang].map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('');
}
$('#startBtn').onclick=()=>{
  AC.resume();sfx('start');startMusic();
  $('#startBtn').style.visibility='hidden';$('#title').style.opacity=0;
  $('#scene').classList.add('zoom');
  setTimeout(()=>show('map'),2000);
};
let introDone=false;
function endIntro(){if(introDone)return;introDone=true;show('start')}
$('#intro').onclick=endIntro;
setTimeout(endIntro,6500);
$('#backBtn').onclick=()=>{sfx('back');show('map')};
['gear','gear2'].forEach(i=>$('#'+i).onclick=()=>$('#settings').classList.toggle('on'));
$('#vol').oninput=e=>musicG.gain.value=e.target.value/100;
$('#fs').oninput=e=>document.documentElement.style.setProperty('--fs',e.target.value+'px');
speechSynthesis.getVoices();
setLang(0,false);

// 데모: index.html#demo 로 열면 인트로→시작→지도→음식 흐름을 자동 재생
if(location.hash==='#demo'){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  (async()=>{
    await wait(7500);
    $('#startBtn').click();
    await wait(3000);
    for(;;){
      for(const id of ['seoul','gangwon','jeonnam','jeju','gyeongbuk']){
        const g=[...document.querySelectorAll('#mapsvg g')][R.findIndex(r=>r.id===id)];
        g.classList.add('hot');await wait(1500);
        g.querySelector('.reg').dispatchEvent(new MouseEvent('click'));
        await wait(3500);
        if(id==='jeonnam'){setLang(1,false);await wait(2500);setLang(3,false);await wait(2500);setLang(0,false)}
        $('#backBtn').click();await wait(1200);
        g.classList.remove('hot');
      }
    }
  })();
}
</script>
</body>
</html>
